# 复制本文件为 application.properties 后再填。application.properties 已 gitignore。
# 不要把账号、密码写进仓库。这里的账号和密码必须留空。
# 路径里的反斜杠会被配置语法吃掉，请用正斜杠。

# WeGame 安装根目录，可改成你的本机路径。
wegame.dir=D:/Program Files (x86)/WeGame
wegame.exe=wegame.exe
wegame.windowTitle=WeGame

# 游戏窗口标题里要包含这段文字。对不上就改成实际标题里的一段。
game.windowTitle=NBA

account=
password=

# 登录框坐标未确认前不会输入密码。对照登录窗口改比例后再设 true。
login.coordsConfirmed=false
login.titleContains=登录
click.login.account.x=0.50
click.login.account.y=0.42
click.login.password.x=0.50
click.login.password.y=0.50

# 必须是窗口模式。客户区不符会停止，不会点菜单。
display.mode=window
display.width=2560
display.height=1440
# 刷新率和画质只作为声明，程序不进设置里改。请事先在游戏内设成 120 与高。
display.refreshHz=120
display.quality=高

# 每日模式场次。默认命令 trial 不用这项，固定 1 场。
daily.matches=5
daily.startHour=9
retry.max=2

# 下面四个开关默认关闭，避免用未经核对的坐标乱点。核对后再改 true。
ui.launchConfirmed=false
ui.menuConfirmed=false
postgame.confirmed=false

ui.menuDelayMs=1200
match.loadWaitSec=45
match.launchTimeoutSec=180
match.maxMinutes=45
match.dribbleMs=2000
match.afterCutMs=400
match.afterPassMs=500
match.idleMs=900

# 假定键位，没有从游戏里读过。请打开游戏「键盘」设置对照后修改。
# 向前：假定镜头在球员身后，W 朝进攻方向运球。
keys.moveForward=W
# 冲刺。
keys.sprint=SHIFT
# 呼叫队友内切。假定为 Q；很多键盘方案里 Q 实际是挡拆，对不上就改。
keys.callCut=Q
# 传球。
keys.pass=K
# 投篮。
keys.shoot=J
# 切到持球人。留空表示不按，假定开局已经控制持球人。
keys.takeControl=

# 客户区比例，左上为 0，右下接近 1。以下都是假定位置，未经实机核对。
# WeGame 里 2KOL2 图标。
click.game.x=0.18
click.game.y=0.28
# 大厅顶栏「人机赛」。
click.pve.x=0.38
click.pve.y=0.06
# 左侧「王朝模式」。
click.dynasty.x=0.14
click.dynasty.y=0.34
# 右侧「非常简单」。
click.difficulty.x=0.76
click.difficulty.y=0.42
# 「进入」。
click.enter.x=0.82
click.enter.y=0.86
# 赛后重开。只在 postgame.confirmed=true 且每日模式的第 2 场及以后使用。
click.rematch.x=0.50
click.rematch.y=0.62

# 可选。放一张终场画面截图后，程序用粗略比对判断结束；对不上就当没结束。
template.matchEnd=

# 相对路径。双击 D:/java/2KOL2Host/2KOL2Host.exe 时，日志在 exe 旁边的 logs 目录。
log.dir=logs
instance.lock=runtime/instance.lock
